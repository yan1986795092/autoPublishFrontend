name: Auto Deploy Frontend

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to LAS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Frontend Deploy: $(date) ==="
            cd /opt/autopublish/frontend
            git fetch origin
            git reset --hard origin/master
            cd /opt/autopublish
            docker-compose -f deploy/docker-compose.yml build --no-cache nginx
            docker-compose -f deploy/docker-compose.yml up -d nginx
            echo "=== Frontend Deploy Done ==="
